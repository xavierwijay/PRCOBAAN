<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Misi Penjaga Hutan 3D — Belajar, Bertindak, dan Selamatkan Hutan!</title>
    <!-- Tailwind CSS & Three.js r128 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        :root {
            --forest-green: #276749;
            --light-green: #689F77;
            --sky-blue: #6BAED6;
            --warm-yellow: #E6B84C;
            --cream: #F6F1E3;
            --dark-green: #183629;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            font-family: 'Nunito', 'Trebuchet MS', sans-serif;
            background: linear-gradient(180deg, #7EB6D9 0%, #A8CBB3 100%);
            color: var(--dark-green);
            overflow-x: hidden;
        }

        h1, h2, h3, h4, .font-title {
            font-family: 'Fredoka', 'Nunito', 'Trebuchet MS', sans-serif;
            letter-spacing: 0.01em;
        }

        /* Utilitas border & z-index tambahan agar kompatibel penuh */
        .border-3 { border-width: 3px; }
        .z-5 { z-index: 5; }

        /* Kanvas 3D Fullscreen di Latar Belakang */
        #world-canvas-container {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            z-index: 0;
            overflow: hidden;
            background: linear-gradient(180deg, #7EB6D9 0%, #A9D0E5 52%, #7AA874 82%, #4E8A52 100%);
        }

        #world-canvas-container canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: pan-y pinch-zoom;
        }

        /* Lapisan Antarmuka di Atas Dunia 3D */
        #ui-root {
            position: relative;
            z-index: 10;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            pointer-events: none;
        }

        .interactive-panel {
            pointer-events: auto;
        }

        /* Kartu Bergaya Game Petualangan 3D */
        .game-panel {
            background: rgba(246, 241, 227, 0.97);
            border: 4px solid #276749;
            box-shadow: 0 12px 28px rgba(24, 54, 41, 0.24), inset 0 2px 0 rgba(252, 249, 242, 0.9);
        }

        .game-panel-soft {
            background: rgba(246, 241, 227, 0.94);
            border: 3px solid rgba(39, 103, 73, 0.82);
            box-shadow: 0 8px 20px rgba(24, 54, 41, 0.18);
        }

        .card-surface {
            background-color: #FCF9F2;
        }

        .scene-art {
            display: block;
            width: 100%;
            height: auto;
            max-height: 185px;
            border-radius: 1.15rem;
            border: 3px solid rgba(39, 103, 73, 0.35);
            box-shadow: 0 4px 12px rgba(24, 54, 41, 0.1);
        }

        .mission-art {
            max-width: 460px;
            margin: 0 auto;
        }

        button:focus-visible, input:focus-visible {
            outline: 4px solid #E6B84C;
            outline-offset: 3px;
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
            }
        }

        .title-3d-shadow {
            text-shadow: 0 2px 0 #F6F1E3, 0 5px 14px rgba(24, 54, 41, 0.28);
        }

        /* Tombol Taktil Ramah Anak */
        .btn-3d {
            position: relative;
            transition: transform 0.14s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.14s ease, filter 0.14s ease;
            cursor: pointer;
            user-select: none;
        }

        .btn-3d::after {
            content: '';
            position: absolute;
            top: 3px;
            left: 10px;
            right: 10px;
            height: 32%;
            border-radius: 999px;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.24) 0%, rgba(255, 255, 255, 0) 100%);
            pointer-events: none;
        }

        .btn-3d:hover:not(:disabled) {
            transform: translateY(-2px);
            filter: brightness(1.03);
        }

        .btn-3d:active:not(:disabled) {
            transform: translateY(3px);
        }

        .btn-3d:disabled {
            opacity: 0.52;
            cursor: not-allowed;
            box-shadow: none !important;
        }

        .btn-green {
            background: linear-gradient(180deg, #3B875B 0%, #276749 100%);
            color: #FCF9F2;
            border: 2px solid #183629;
            box-shadow: 0 5px 0 #183629, 0 8px 16px rgba(24, 54, 41, 0.22);
        }
        .btn-green:active:not(:disabled) { box-shadow: 0 2px 0 #183629; }

        .btn-yellow {
            background: linear-gradient(180deg, #F0C96B 0%, #E0B042 100%);
            color: #183629;
            border: 2px solid #9E7418;
            box-shadow: 0 5px 0 #9E7418, 0 8px 14px rgba(158, 116, 24, 0.2);
        }
        .btn-yellow:active:not(:disabled) { box-shadow: 0 2px 0 #9E7418; }

        .btn-blue {
            background: linear-gradient(180deg, #9ECAE1 0%, #6BAED6 100%);
            color: #183629;
            border: 2px solid #2B6CB0;
            box-shadow: 0 5px 0 #2B6CB0, 0 8px 14px rgba(43, 108, 176, 0.18);
        }
        .btn-blue:active:not(:disabled) { box-shadow: 0 2px 0 #2B6CB0; }

        .btn-orange {
            background: linear-gradient(180deg, #E59853 0%, #D4762C 100%);
            color: #FCF9F2;
            border: 2px solid #8C4312;
            box-shadow: 0 5px 0 #8C4312, 0 8px 14px rgba(140, 67, 18, 0.2);
        }
        .btn-orange:active:not(:disabled) { box-shadow: 0 2px 0 #8C4312; }

        .btn-cream {
            background: #F6F1E3;
            color: #183629;
            border: 3px solid #276749;
            box-shadow: 0 4px 0 #276749;
        }
        .btn-cream:active:not(:disabled) { box-shadow: 0 1px 0 #276749; }

        @keyframes popScale {
            0% { opacity: 0; transform: scale(0.93) translateY(12px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 0 0 rgba(230, 184, 76, 0.75); }
            50% { box-shadow: 0 0 0 10px rgba(230, 184, 76, 0); }
        }

        @keyframes confettiFall {
            0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }

        .animate-pop {
            animation: popScale 0.34s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        .animate-pulse-glow {
            animation: pulseGlow 2s infinite;
        }

        .confetti-bit {
            position: fixed;
            top: -16px;
            width: 12px;
            height: 12px;
            border-radius: 3px;
            z-index: 90;
            pointer-events: none;
            animation: confettiFall linear forwards;
        }

        /* Tooltip Penanda Objek 3D Melayang */
        .world-callout {
            position: fixed;
            transform: translate(-50%, -100%);
            pointer-events: auto;
            z-index: 8;
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        /* Mode ringkas desktop: UI lebih compact agar tidak perlu zoom browser manual */
        @media (min-width: 1024px) {
            #top-hud {
                padding-top: 0.38rem !important;
                padding-bottom: 0.38rem !important;
            }

            #screen-container {
                font-size: 0.92rem;
            }

            #screen-container section {
                padding-top: 0.5rem !important;
                padding-bottom: 0.6rem !important;
            }

            #screen-container .game-panel {
                border-width: 3px;
                box-shadow: 0 8px 18px rgba(24, 54, 41, 0.18), inset 0 1px 0 rgba(252, 249, 242, 0.9);
            }

            #screen-container .game-panel-soft {
                border-width: 2px;
                box-shadow: 0 6px 14px rgba(24, 54, 41, 0.14);
            }

            #screen-container .mission-art {
                max-width: 370px;
            }

            #screen-container .scene-art {
                max-height: 140px;
            }

            #screen-container h2 {
                font-size: 1.3rem !important;
                line-height: 1.2 !important;
            }

            #screen-container h3 {
                font-size: 1.08rem !important;
                linzht: 1.25 !important;
            }

            #screen-container p,
            #screen-container button,
            #screen-container span,
            #screen-container label {
                font-size: 0.88rem;
                line-height: 1.3;
            }

            #screen-container .btn-3d {
                padding-top: 0.5rem !important;
                padding-bottom: 0.5rem !important;
            }

            #screen-container .rounded-3xl {
                border-radius: 1.1rem !important;
            }
        }

        @media (min-width: 1024px) and (max-height: 850px) {
            #screen-container {
                font-size: 0.88rem;
            }

            #screen-container .mission-art {
                max-width: 330px;
            }

            #screen-container .scene-art {
                max-height: 122px;
            }

            #screen-container section {
                padding-top: 0.35rem !important;
                padding-bottom: 0.45rem !important;
            }
        }
    </style>
</head>
<body>

    <!-- DUNIA 3D UTAMA (THREE.JS WEBGL CANVAS) -->
    <div id="world-canvas-container" aria-label="Dunia Hutan 3D Dusun Cuntel"></div>

    <!-- PENANDA LABEL 3D MELAYANG DI ATAS POS & NPC -->
    <div id="world-markers-layer" class="fixed inset-0 pointer-events-none z-5"></div>

    <!-- ANTARMUKA PENGGUNA (HUD & LAYAR PERMAINAN) -->
    <div id="ui-root">
        <!-- HUD ATAS -->
        <header id="top-hud" class="hidden interactive-panel sticky top-0 z-30 bg-[#183629]/95 backdrop-blur-md text-[#FCF9F2] px-3 py-2 sm:px-5 border-b-4 border-[#276749] shadow-lg">
            <div class="max-w-6xl mx-auto flex flex-wrap items-center justify-between gap-2">
                <!-- Kiri: Identitas Pemain & Peta 3D -->
                <div class="flex items-center gap-2">
                    <button onclick="navigateTo('explore')" id="hud-explore-btn" class="bg-[#276749] hover:bg-[#317A57] border-2 border-[#8FB899]/60 text-[#FCF9F2] font-extrabold px-3 py-1.5 rounded-2xl text-xs sm:text-sm flex items-center gap-1.5 transition active:scale-95">
                        <span id="hud-icon-compass"></span>
                        <span>Hutan 3D</span>
                    </button>
                    <button onclick="navigateTo('report')" class="bg-[#DCEEF8] hover:bg-[#FCF9F2] border-2 border-[#6BAED6] text-[#183629] font-extrabold px-3 py-1.5 rounded-2xl text-xs sm:text-sm flex items-center gap-1.5 transition active:scale-95">
                        <span id="hud-icon-chart"></span>
                        <span class="hidden sm:inline">Laporan</span>
                    </button>
                </div>

                <!-- Tengah: Progres Misi -->
                <div class="flex-1 max-w-xs mx-2 hidden md:block">
                    <div class="flex justify-between text-xs font-extrabold text-[#F6F1E3] mb-1">
                        <span id="hud-player-label">Penjaga Hutan</span>
                        <span id="hud-progress-label" class="text-[#F0C96B]">0 / 5 Pos</span>
                    </div>
                    <div class="w-full h-3.5 bg-[#0F241B] rounded-full overflow-hidden p-0.5 border border-[#8FB899]/70">
                        <div id="hud-progress-bar" class="h-full bg-gradient-to-r from-[#689F77] via-[#9BC184] to-[#E6B84C] rounded-full transition-all duration-500" style="width: 0%"></div>
                    </div>
                </div>

                <!-- Kanan: Skor, Lencana, Jeda & Pengaturan -->
                <div class="flex items-center gap-1.5 sm:gap-2">
                    <div class="bg-[#276749] border-2 border-[#E6B84C] px-3 py-1 rounded-2xl flex items-center gap-1.5 font-extrabold text-xs sm:text-sm text-[#F0C96B]">
                        <span id="hud-icon-star"></span>
                        <span id="hud-score">0</span>
                    </div>
                    <button onclick="navigateTo('achievements')" class="bg-[#F6F1E3] hover:bg-[#FCF9F2] border-2 border-[#E6B84C] text-[#183629] font-extrabold px-2.5 py-1.5 rounded-2xl text-xs sm:text-sm flex items-center gap-1.5 transition active:scale-95">
                        <span id="hud-icon-badge"></span>
                        <span id="hud-badge-count" class="bg-[#276749] text-[#FCF9F2] text-xs px-1.5 py-0.2 rounded-full">0</span>
                    </button>
                    <button onclick="openPauseModal()" aria-label="Jeda Permainan" title="Jeda" class="bg-[#E6B84C] hover:bg-[#F0C96B] text-[#183629] border-2 border-[#F6F1E3] p-1.5 sm:p-2 rounded-2xl transition active:scale-95">
                        <span id="hud-icon-pause"></span>
                    </button>
                    <button onclick="openSettingsModal()" aria-label="Pengaturan" title="Pengaturan" class="bg-[#276749] hover:bg-[#317A57] text-[#FCF9F2] border-2 border-[#8FB899]/60 p-1.5 sm:p-2 rounded-2xl transition active:scale-95">
                        <span id="hud-icon-gear"></span>
                    </button>
                </div>
            </div>
        </header>

        <!-- WADAH LAYAR AKTIF -->
        <main id="screen-container" class="flex-1 flex flex-col justify-between"></main>
    </div>

    <!-- MODAL KUSTOM (DIALOG, PETUNJUK, JEDA, PENGATURAN, AKSES PENDIDIK) -->
    <div id="modal-backdrop" class="hidden fixed inset-0 z-50 bg-[#183629]/75 backdrop-blur-sm flex items-center justify-center p-4">
        <div id="modal-box" class="game-panel rounded-3xl max-w-lg w-full p-5 sm:p-7 animate-pop relative max-h-[90vh] overflow-y-auto">
            <div id="modal-content"></div>
        </div>
    </div>

    <script>
        /**
         * ============================================================================
         * 1. KOLEKSI IKON VEKTOR (SVG) & ILUSTRASI VISUAL CERITA RAMAH ANAK SD
         * ============================================================================
         */
        const IconSVG = {
            tree(cls = "w-6 h-6") {
                return `<svg viewBox="0 0 24 24" class="${cls}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3L5 12h4l-3 6h12l-3-6h4L12 3z" fill="#3B875B" stroke="#183629"/><path d="M12 18v3" stroke="#5D4037" stroke-width="2.5"/></svg>`;
            },
            flame(cls = "w-6 h-6") {
                return `<svg viewBox="0 0 24 24" class="${cls}" fill="none"><path d="M12 2C9 6 6 9.5 6 14a6 6 0 0 0 12 0c0-3.5-2-6.5-4-8.5-.3 2-1.5 3-2.5 3 0-2.5.5-4.5.5-6.5z" fill="#E07A47" stroke="#8C3B19" stroke-width="1.8"/><path d="M12 10c-1.5 2-2.5 3.5-2.5 5.5a2.5 2.5 0 0 0 5 0c0-1.5-1-3-2.5-5.5z" fill="#F0C96B"/></svg>`;
            },
            shield(cls = "w-6 h-6") {
                return `<svg viewBox="0 0 24 24" class="${cls}" fill="none"><path d="M12 2L4 5.5v6c0 5.2 3.4 9.8 8 11 4.6-1.2 8-5.8 8-11v-6L12 2z" fill="#3B875B" stroke="#183629" stroke-width="1.8"/><path d="M9 12l2 2 4-4" stroke="#FCF9F2" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
            },
            compass(cls = "w-5 h-5") {
                return `<svg viewBox="0 0 24 24" class="${cls}" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="9"/><polygon points="15.5,8.5 13.5,13.5 8.5,15.5 10.5,10.5" fill="#E6B84C" stroke="currentColor" stroke-width="1.6"/></svg>`;
            },
            star(cls = "w-5 h-5") {
                return `<svg viewBox="0 0 24 24" class="${cls}"><polygon points="12,2 15.1,8.3 22,9.3 17,14.1 18.2,21 12,17.7 5.8,21 7,14.1 2,9.3 8.9,8.3" fill="#F0C96B" stroke="#9E7418" stroke-width="1.6" stroke-linejoin="round"/></svg>`;
            },
            badge(cls = "w-5 h-5") {
                return `<svg viewBox="0 0 24 24" class="${cls}" fill="none"><circle cx="12" cy="9" r="6" fill="#E6B84C" stroke="#183629" stroke-width="2"/><path d="M8.5 14L7 21l5-2.5L17 21l-1.5-7" fill="#3B875B" stroke="#183629" stroke-width="1.8" stroke-linejoin="round"/></svg>`;
            },
            chart(cls = "w-5 h-5") {
                return `<svg viewBox="0 0 24 24" class="${cls}" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="4" y="12" width="3.5" height="8" rx="1" fill="#6BAED6"/><rect x="10.2" y="7" width="3.5" height="13" rx="1" fill="#3B875B"/><rect x="16.5" y="4" width="3.5" height="16" rx="1" fill="#E6B84C"/></svg>`;
            },
            pause(cls = "w-5 h-5") {
                return `<svg viewBox="0 0 24 24" class="${cls}" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1.5"/><rect x="14" y="5" width="4" height="14" rx="1.5"/></svg>`;
            },
            gear(cls = "w-5 h-5") {
                return `<svg viewBox="0 0 24 24" class="${cls}" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9c.26.6.77 1.02 1.42 1.11H21a2 2 0 0 1 0 4h-.09c-.65.09-1.16.51-1.51 1.11z"/></svg>`;
            },
            bulb(cls = "w-5 h-5") {
                return `<svg viewBox="0 0 24 24" class="${cls}" fill="none"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.7.5 1.2 1.3 1.3 2.1h4.4c.1-.8.6-1.6 1.3-2.1A6 6 0 0 0 12 3z" fill="#E6B84C" stroke="#183629" stroke-width="1.8" stroke-linecap="round"/></svg>`;
            },
            crown(cls = "w-6 h-6") {
                return `<svg viewBox="0 0 24 24" class="${cls}" fill="none"><path d="M3 18h18l-1.5-10-4.5 4-3-6-3 6-4.5-4L3 18z" fill="#E6B84C" stroke="#183629" stroke-width="1.8" stroke-linejoin="round"/></svg>`;
            },
            lock(cls = "w-6 h-6") {
                return `<svg viewBox="0 0 24 24" class="${cls}" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="5" y="11" width="14" height="10" rx="2.5" fill="#CFD8DC"/><path d="M8 11V7a4 4 0 0 1 8 0v4" stroke-linecap="round"/></svg>`;
            },
            check(cls = "w-5 h-5") {
                return `<svg viewBox="0 0 24 24" class="${cls}" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`;
            },
            educator(cls = "w-5 h-5") {
                return `<svg viewBox="0 0 24 24" class="${cls}" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 10L12 5 2 10l10 5 10-5z" fill="#6BAED6"/><path d="M6 12v5c3 2 9 2 12 0v-5"/></svg>`;
            },
            trash(cls = "w-5 h-5") {
                return `<svg viewBox="0 0 24 24" class="${cls}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg>`;
            },
            // Potret Karakter untuk Kartu Dialog & Pilihan Karakter
            portrait(type, cls = "w-20 h-20") {
                if (type === 'kiki') {
                    return `<svg viewBox="0 0 120 120" class="${cls}" role="img" aria-label="Kiki Penjaga Rimba"><circle cx="60" cy="60" r="56" fill="#DFECE3" stroke="#276749" stroke-width="5"/><path d="M30 110c0-24 60-24 60 0z" fill="#276749"/><path d="M45 86l15 14 15-14z" fill="#E6B84C"/><circle cx="60" cy="58" r="24" fill="#F2C094"/><path d="M36 52c0-18 48-18 48 0-8-8-18-6-24-10-6 4-16 2-24 10z" fill="#4E342E"/><ellipse cx="60" cy="36" rx="34" ry="8" fill="#183629"/><path d="M40 36c0-16 40-16 40 0z" fill="#276749"/><circle cx="51" cy="57" r="3.5" fill="#183629"/><circle cx="69" cy="57" r="3.5" fill="#183629"/><path d="M52 67q8 8 16 0" fill="none" stroke="#183629" stroke-width="3" stroke-linecap="round"/></svg>`;
                }
                if (type === 'sari') {
                    return `<svg viewBox="0 0 120 120" class="${cls}" role="img" aria-label="Sari Penjelajah"><circle cx="60" cy="60" r="56" fill="#DCEEF8" stroke="#2B6CB0" stroke-width="5"/><path d="M30 110c0-24 60-24 60 0z" fill="#2B6CB0"/><circle cx="34" cy="52" r="10" fill="#3E2723"/><circle cx="86" cy="52" r="10" fill="#3E2723"/><circle cx="60" cy="58" r="24" fill="#F2C094"/><path d="M37 50c2-18 44-18 46 0z" fill="#3E2723"/><path d="M40 40c0-14 40-14 40 0z" fill="#D97343"/><rect x="52" y="38" width="28" height="5" rx="2.5" fill="#8C3B19"/><circle cx="51" cy="57" r="3.5" fill="#183629"/><circle cx="69" cy="57" r="3.5" fill="#183629"/><path d="M52 67q8 8 16 0" fill="none" stroke="#183629" stroke-width="3" stroke-linecap="round"/></svg>`;

        function shuffleArray(arr) {
            const copy = [...arr];
            for (let i = copy.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [copy[i], copy[j]] = [copy[j], copy[i]];
            }
            return copy;
        }

        const AudioEngine = (() => {
            let ctx = null;
            let bgmTimer = null;
            let noteIdx = 0;
            // Melodi ceria bernuansa petualangan hutan (nada utama + bas lembut)
            const melody = [
                523.25, 659.25, 783.99, 659.25,
                587.33, 698.46, 880.00, 698.46,
                523.25, 659.25, 783.99, 1046.50,
                880.00, 783.99, 659.25, 587.33
            ];
            const bassNotes = [
                261.63, 196.00, 261.63, 196.00,
                293.66, 220.00, 293.66, 220.00,
                261.63, 196.00, 261.63, 246.94,
                220.00, 196.00, 174.61, 196.00
            ];

            function ensureCtx() {
                if (!ctx && (window.AudioContext || window.webkitAudioContext)) {
                    ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (ctx && ctx.state === 'suspended') {
                    ctx.resume().catch(() => {});
                }
                return ctx;
            }

            function tone(freq, type, dur, delay = 0, vol = 0.12) {
                if (!state.settings.sfx) return;
                try {
                    const c = ensureCtx();
                    if (!c) return;
                    const osc = c.createOscillator();
                    const gain = c.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, c.currentTime + delay);
                    gain.gain.setValueAtTime(0.001, c.currentTime + delay);
                    gain.gain.exponentialRampToValueAtTime(vol, c.currentTime + delay + 0.02);
                    gain.gain.exponentialRampToValueAtTime(0.001, c.currentTime + delay + dur);
                    osc.connect(gain);
                    gain.connect(c.destination);
                    osc.start(c.currentTime + delay);
                    osc.stop(c.currentTime + delay + dur + 0.03);
                } catch (e) {}
            }

            function playBgmStep() {
                if (!state.settings.music || state.paused) return;
                try {
                    const c = ensureCtx();
                    if (!c || c.state !== 'running') return;
                    const idx = noteIdx % melody.length;
                    noteIdx++;

                    // Nada melodi utama
                    const osc = c.createOscillator();
                    const gain = c.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(melody[idx], c.currentTime);
                    gain.gain.setValueAtTime(0.0008, c.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.036, c.currentTime + 0.04);
                    gain.gain.exponentialRampToValueAtTime(0.0008, c.currentTime + 0.42);
                    osc.connect(gain);
                    gain.connect(c.destination);
                    osc.start(c.currentTime);
                    osc.stop(c.currentTime + 0.45);

                    // Iringan bas lembut setiap 2 ketukan
                    if (idx % 2 === 0) {
                        const bassOsc = c.createOscillator();
                        const bassGain = c.createGain();
                        bassOsc.type = 'sine';
                        bassOsc.frequency.setValueAtTime(bassNotes[idx], c.currentTime);
                        bassGain.gain.setValueAtTime(0.0008, c.currentTime);
                        bassGain.gain.exponentialRampToValueAtTime(0.045, c.currentTime + 0.06);
                        bassGain.gain.exponentialRampToValueAtTime(0.0008, c.currentTime + 0.82);
                        bassOsc.connect(bassGain);
                        bassGain.connect(c.destination);
                        bassOsc.start(c.currentTime);
                        bassOsc.stop(c.currentTime + 0.85);
                    }
                } catch (e) {}
            }

            function startMusic() {
                if (bgmTimer) return;
                playBgmStep();
                bgmTimer = setInterval(playBgmStep, 480);
            }

            function stopMusic() {
                if (bgmTimer) {
                    clearInterval(bgmTimer);
                    bgmTimer = null;
                }
            }

            return {
                unlock() {
                    ensureCtx();
                    if (state.settings.music) startMusic();
                },
                click() {
                    this.unlock();
                    tone(540, 'sine', 0.08, 0, 0.10);
                },
                discover() {
                    this.unlock();
                    tone(440, 'triangle', 0.12, 0, 0.13);
                    tone(659.25, 'triangle', 0.2, 0.09, 0.14);
                },
                correct() {
                    this.unlock();
                    tone(523.25, 'triangle', 0.13, 0, 0.14);
                    tone(659.25, 'triangle', 0.13, 0.08, 0.14);
                    tone(783.99, 'triangle', 0.24, 0.16, 0.16);
                },
                retry() {
                    this.unlock();
                    tone(349.23, 'sine', 0.15, 0, 0.10);
                    tone(311.13, 'sine', 0.2, 0.11, 0.10);
                },
                fanfare() {
                    this.unlock();
                    tone(523.25, 'triangle', 0.14, 0, 0.16);
                    tone(659.25, 'triangle', 0.14, 0.1, 0.16);
                    tone(783.99, 'triangle', 0.14, 0.2, 0.16);
                    tone(1046.5, 'triangle', 0.42, 0.3, 0.18);
                },
                syncMusic() {
                    if (state.settings.music) {
                        ensureCtx();
                        startMusic();
                    } else {
                        stopMusic();
                    }
                }
            };
        })();

        const ForestWorld3D = (() => {

            let owlParts = {};
            let jokoNpcGroup = null;
            let jokoNpcParts = {};

            let butterflies = [];
            let treeGroups = [];
            let treeColliders = [];
            let flowerMeshes = [];
            let waterMesh = null;
            let landmarkMeshes = {};
            let mission1Meshes = {};
            let mission5GardenGroup = null;
            let dustParticles = null;
            let lastRenderAt = 0;

            let camMode = 'orbitWelcome';
            let camGoalPos = new THREE.Vector3(0, 18, 34);
            let camGoalLook = new THREE.Vector3(0, 2, 0);
            let camCurrentLook = new THREE.Vector3(0, 2, 0);

            const pointerNDC = new THREE.Vector2();
            const interactiveTargets = [];

            const BRIDGE_SOUTH = { z: 13.0, halfWidth: 2.3, halfSpan: 3.2 };
            const BRIDGE_NORTH = { z: -15.0, halfWidth: 2.3, halfSpan: 3.2 };

            function getRiverCenterX(z) {
                return -6.5 - z * 0.15;
            }

            function isOnBridge(x, z) {
                const sCenter = getRiverCenterX(BRIDGE_SOUTH.z);
                if (Math.abs(z - BRIDGE_SOUTH.z) <= BRIDGE_SOUTH.halfWidth && Math.abs(x - sCenter) <= BRIDGE_SOUTH.halfSpan) {
                    return true;
                }
                const nCenter = getRiverCenterX(BRIDGE_NORTH.z);
                if (Math.abs(z - BRIDGE_NORTH.z) <= BRIDGE_NORTH.halfWidth && Math.abs(x - nCenter) <= BRIDGE_NORTH.halfSpan) {
                    return true;
                }
                return false;
            }

            function isPointInWater(x, z) {
                if (Math.abs(z) > 25.0) return false;
                if (isOnBridge(x, z)) return false;
                const rCenter = getRiverCenterX(z);
                return Math.abs(x - rCenter) < 2.35;
            }

            function clampOutOfWater(x, z) {
                if (!isPointInWater(x, z)) return { x, z };
                const rCenter = getRiverCenterX(z);
                const bankOffset = 2.65;
                const safeX = x >= rCenter ? rCenter + bankOffset : rCenter - bankOffset;
                return { x: Math.max(-22, Math.min(22, safeX)), z };
            }

            function clampOutOfObstacles(x, z) {
                let cx = Math.max(-22, Math.min(22, x));
                let cz = Math.max(-22, Math.min(22, z));

                if (cx > -3.1 && cx < 3.1 && cz > -0.6 && cz < 4.6) {
                    const dFront = Math.abs(cz - 4.6);
                    const dBack = Math.abs(cz - (-0.6));
                    const dLeft = Math.abs(cx - (-3.1));
                    const dRight = Math.abs(cx - 3.1);
                    const minD = Math.min(dFront, dBack, dLeft, dRight);
                    if (minD === dFront) cz = 4.65;
                    else if (minD === dBack) cz = -0.65;
                    else if (minD === dLeft) cx = -3.15;
                    else cx = 3.15;
                }

                for (let i = 0; i < treeColliders.length; i++) {
                    const tc = treeColliders[i];
                    const dx = cx - tc.x;
                    const dz = cz - tc.z;
                    const dist = Math.hypot(dx, dz);
                    if (dist < tc.r && dist > 0.001) {
                        cx = tc.x + (dx / dist) * tc.r;
                        cz = tc.z + (dz / dist) * tc.r;
                    }
                }
                return { x: cx, z: cz };
            }

            function setNavigationDestination(destX, destZ) {
                let clean = clampOutOfWater(destX, destZ);
                clean = clampOutOfObstacles(clean.x, clean.z);

                const startSide = playerPos.x >= getRiverCenterX(playerPos.z) ? 1 : -1;
                const endSide = clean.x >= getRiverCenterX(clean.z) ? 1 : -1;

                playerWaypoints = [];
                if (startSide !== endSide && Math.abs(clean.z) < 25) {
                    const distSouth = Math.abs(playerPos.z - BRIDGE_SOUTH.z) + Math.abs(clean.z - BRIDGE_SOUTH.z);
                    const distNorth = Math.abs(playerPos.z - BRIDGE_NORTH.z) + Math.abs(clean.z - BRIDGE_NORTH.z);
                    const bridge = distSouth <= distNorth ? BRIDGE_SOUTH : BRIDGE_NORTH;
                    const bCenter = getRiverCenterX(bridge.z);

                    const entryX = bCenter + startSide * 3.1;
                    const exitX = bCenter + endSide * 3.1;

                    playerWaypoints.push(new THREE.Vector3(entryX, 0, bridge.z));
                    playerWaypoints.push(new THREE.Vector3(bCenter, 0, bridge.z));
                    playerWaypoints.push(new THREE.Vector3(exitX, 0, bridge.z));
                }
                playerWaypoints.push(new THREE.Vector3(clean.x, 0, clean.z));
                playerTarget.copy(playerWaypoints.shift());
            }

            function setupLighting() {
                const hemiLight = new THREE.HemisphereLight(0xE8F6FF, 0x355E3B, 0.85);
                hemiLight.position.set(0, 50, 0);
                scene.add(hemiLight);

                const sunLight = new THREE.DirectionalLight(0xFFF6DE, 0.92);
                sunLight.position.set(26, 44, 24);

                sunLight.shadow.mapSize.width = 1024;
                sunLight.shadow.mapSize.height = 1024;
                sunLight.shadow.camera.near = 5;
                sunLight.shadow.camera.far = 120;
                const d = 36;

                sunLight.shadow.camera.right = d;

                sunLight.shadow.camera.bottom = -d;
                sunLight.shadow.bias = -0.0005;

                scene.userData.sunLight = sunLight;
            }

            function buildTerrainAndRiver() {
                const groundGeo = new THREE.PlaneGeometry(160, 160, 28, 28);
                groundGeo.rotateX(-Math.PI / 2);
                const posAttr = groundGeo.attributes.position;
                for (let i = 0; i < posAttr.count; i++) {
                    const x = posAttr.getX(i);
                    const z = posAttr.getZ(i);
                    const distFromCenter = Math.hypot(x, z);
                    let y = 0;
                    if (distFromCenter > 26) {
                        y = Math.sin(x * 0.12) * 1.4 + Math.cos(z * 0.12) * 1.4 + (distFromCenter - 26) * 0.16;
                    }
                    posAttr.setY(i, y);
                }
                groundGeo.computeVertexNormals();

                const groundMat = new THREE.MeshStandardMaterial({
                    color: 0x4F8D54,
                    roughness: 0.88,
                    metalness: 0.02
                });
                const ground = new THREE.Mesh(groundGeo, groundMat);
                ground.receiveShadow = true;
                ground.name = 'ground';
                scene.add(ground);
                interactiveTargets.push(ground);

                const meadowGeo = new THREE.CylinderGeometry(25, 27, 0.25, 36);
                const meadowMat = new THREE.MeshStandardMaterial({ color: 0x62A35E, roughness: 0.9 });
                const meadow = new THREE.Mesh(meadowGeo, meadowMat);
                meadow.position.y = 0.05;
                meadow.receiveShadow = true;
                meadow.name = 'ground';
                scene.add(meadow);
                interactiveTargets.push(meadow);

                const pathPoints = [
                    new THREE.Vector3(0, 0.2, 18),
                    new THREE.Vector3(-4.5, 0.2, 14.5),
                    new THREE.Vector3(getRiverCenterX(BRIDGE_SOUTH.z), 0.2, BRIDGE_SOUTH.z),
                    new THREE.Vector3(-12.5, 0.2, 11.5),
                    new THREE.Vector3(-16, 0.2, 10),
                    new THREE.Vector3(-15.5, 0.2, -1),
                    new THREE.Vector3(-14, 0.2, -12),
                    new THREE.Vector3(-9, 0.2, -14.5),
                    new THREE.Vector3(getRiverCenterX(BRIDGE_NORTH.z), 0.2, BRIDGE_NORTH.z),
                    new THREE.Vector3(4, 0.2, -18),
                    new THREE.Vector3(14, 0.2, -13),
                    new THREE.Vector3(18, 0.2, -6),
                    new THREE.Vector3(17, 0.2, 5),
                    new THREE.Vector3(14, 0.2, 13),
                    new THREE.Vector3(6, 0.2, 17),
                    new THREE.Vector3(0, 0.2, 18)
                ];
                const curve = new THREE.CatmullRomCurve3(pathPoints);
                const trailSamples = curve.getPoints(100);
                const trailMat = new THREE.MeshStandardMaterial({ color: 0xDEC99A, roughness: 0.94 });
                const stoneGeo = new THREE.CylinderGeometry(1.1, 1.25, 0.14, 10);

                trailSamples.forEach((pt, idx) => {
                    if (idx % 2 === 0 && !isPointInWater(pt.x, pt.z)) {
                        const seg = new THREE.Mesh(stoneGeo, trailMat);
                        seg.position.set(pt.x, 0.16, pt.z);
                        seg.receiveShadow = true;
                        scene.add(seg);
                    }
                });

                const riverGeo = new THREE.PlaneGeometry(4.4, 50, 6, 32);
                riverGeo.rotateX(-Math.PI / 2);
                const rPos = riverGeo.attributes.position;
                for (let i = 0; i < rPos.count; i++) {
                    const lx = rPos.getX(i);
                    const lz = rPos.getZ(i);
                    rPos.setX(i, lx + getRiverCenterX(lz));
                }
                riverGeo.computeVertexNormals();

                const riverMat = new THREE.MeshStandardMaterial({
                    color: 0x2B95CC,
                    roughness: 0.22,
                    metalness: 0.1,
                    transparent: true,
                    opacity: 0.92
                });
                waterMesh = new THREE.Mesh(riverGeo, riverMat);
                waterMesh.position.set(0, 0.19, 0);
                waterMesh.receiveShadow = true;
                scene.add(waterMesh);

                [BRIDGE_SOUTH, BRIDGE_NORTH].forEach(br => {
                    const bridgeGroup = new THREE.Group();
                    const plankMat = new THREE.MeshStandardMaterial({ color: 0x855E42, roughness: 0.85 });
                    const railMat = new THREE.MeshStandardMaterial({ color: 0x5D4037, roughness: 0.9 });

                    for (let i = -3; i <= 3; i++) {
                        const plank = new THREE.Mesh(new THREE.BoxGeometry(6.2, 0.2, 0.56), plankMat);
                        plank.position.set(0, 0.36, i * 0.62);
                        plank.castShadow = true;
                        plank.receiveShadow = true;
                        bridgeGroup.add(plank);
                    }
                    [-2.0, 2.0].forEach(rz => {
                        const rail = new THREE.Mesh(new THREE.BoxGeometry(6.2, 0.14, 0.14), railMat);
                        rail.position.set(0, 0.95, rz);
                        rail.castShadow = true;
                        bridgeGroup.add(rail);
                        [-2.6, 0, 2.6].forEach(px => {
                            const post = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.7, 0.14), railMat);
                            post.position.set(px, 0.65, rz);
                            bridgeGroup.add(post);

                    scene.add(bridgeGroup);

                const rockMat = new THREE.MeshStandardMaterial({ color: 0x7E919B, roughness: 0.88, flatShading: true });
                const rockCoords = [
                    [getRiverCenterX(6) + 2.7, 0.35, 6],
                    [getRiverCenterX(2) - 2.7, 0.4, 2],
                    [getRiverCenterX(-4) + 2.7, 0.3, -4],
                    [getRiverCenterX(-9) - 2.7, 0.45, -9],
                    [10, 0.35, 2], [-19, 0.5, -5], [20, 0.45, 8]
                ];
                rockCoords.forEach(([rx, ry, rz]) => {

            function createStylizedTree(x, z, scale = 1, variant = 0) {
                const g = new THREE.Group();

                    new THREE.CylinderGeometry(0.24 * scale, 0.36 * scale, 1.8 * scale, 7),

                );
                trunk.position.y = 0.9 * scale;

                g.add(trunk);

                if (variant % 2 === 0) {
                    const colors = [0x1F542E, 0x2D6E3E, 0x3E874D];
                    for (let layer = 0; layer < 3; layer++) {
                        const cone = new THREE.Mesh(
                            new THREE.ConeGeometry((1.55 - layer * 0.32) * scale, 1.85 * scale, 7),
                            new THREE.MeshStandardMaterial({ color: colors[layer], roughness: 0.82, flatShading: true })
                        );

                        cone.castShadow = true;
                        cone.receiveShadow = true;
                        g.add(cone);
                    }
                } else {
                    const crownMat = new THREE.MeshStandardMaterial({ color: 0x2E6B3E, roughness: 0.84, flatShading: true });
                    const mainCrown = new THREE.Mesh(new THREE.DodecahedronGeometry(1.55 * scale, 1), crownMat);
                    mainCrown.position.y = 2.75 * scale;
                    mainCrown.castShadow = true;
                    g.add(mainCrown);

                        new THREE.DodecahedronGeometry(1.05 * scale, 1),

                    );
                    sideCrown.position.set(0.75 * scale, 2.35 * scale, 0.4 * scale);
                    sideCrown.castShadow = true;
                    g.add(sideCrown);
                }

                scene.add(g);
                treeGroups.push(g);
                treeColliders.push({ x, z, r: 0.95 * scale });

            function buildForestFoliage() {
                const treeSpots = [
                    [-23, 18, 1.15, 0], [-24, 2, 1.25, 1], [-23, -16, 1.1, 0],
                    [-12, -22, 1.3, 1], [0, -24, 1.2, 0], [12, -22, 1.15, 1],

                    [-28, -8, 1.35, 0], [28, -9, 1.35, 1], [0, -30, 1.4, 0]
                ];
                treeSpots.forEach(([x, z, s, v]) => {
                    if (!isPointInWater(x, z)) {

                });

                // Bunga liar selalu dibuat agar bisa di-toggle lewat Pengaturan Grafis
                const flowerColors = [0xE6B84C, 0xD98278, 0xEFE7D6, 0x6BAED6];
                const stemGeo = new THREE.CylinderGeometry(0.03, 0.03, 0.35, 5);
                const petalGeo = new THREE.DodecahedronGeometry(0.16, 0);
                for (let i = 0; i < 42; i++) {
                    const angle = (i / 42) * Math.PI * 2;
                    const radius = 6.2 + (i % 7) * 2.5;
                    const fx = Math.cos(angle) * radius;
                    const fz = Math.sin(angle) * radius;
                    if (isPointInWater(fx, fz)) continue;

                    const flower = new THREE.Group();
                    const stem = new THREE.Mesh(stemGeo, new THREE.MeshStandardMaterial({ color: 0x276749 }));
                    stem.position.y = 0.25;
                    const bloom = new THREE.Mesh(
                        petalGeo,
                        new THREE.MeshStandardMaterial({ color: flowerColors[i % flowerColors.length] })
                    );
                    bloom.position.y = 0.44;
                    flower.add(stem, bloom);
                    flower.position.set(fx, 0.05, fz);
                    scene.add(flower);
                    flowerMeshes.push(flower);
                }

                // Partikel cahaya hutan lembut
                const pCount = 60;
                const pGeo = new THREE.BufferGeometry();
                const pPos = new Float32Array(pCount * 3);
                for (let i = 0; i < pCount; i++) {
                    pPos[i * 3] = (Math.random() - 0.5) * 44;

                pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
                const pMat = new THREE.PointsMaterial({ color: 0xF6ECC9, size: 0.25, transparent: true, opacity: 0.7 });
                dustParticles = new THREE.Points(pGeo, pMat);
                scene.add(dustParticles);
            }

                const deerMat = new THREE.MeshStandardMaterial({ color: 0xB56B3D, roughness: 0.85, flatShading: true });

                const eyeShineMat = new THREE.MeshBasicMaterial({ color: 0xFCF9F2 });

                const addDeerBone = (parent, start, end, radius, material, sides = 7) => {
                    const from = new THREE.Vector3(start[0], start[1], start[2]);
                    const to = new THREE.Vector3(end[0], end[1], end[2]);
                    const direction = new THREE.Vector3().subVectors(to, from);
                    const bone = new THREE.Mesh(
                        new THREE.CylinderGeometry(radius * 0.72, radius, direction.length(), sides),
                        material
                    );
                    bone.position.copy(from).add(to).multiplyScalar(0.5);
                    bone.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction.normalize());
                    bone.castShadow = true;
                    parent.add(bone);
                    return bone;
                };

                const dBody = new THREE.Mesh(new THREE.SphereGeometry(0.58, 12, 9), deerMat);
                dBody.scale.set(0.95, 0.85, 1.44);
                dBody.position.set(0, 1.02, -0.12);

                neck.position.set(0, 1.58, 0.62);
                neck.rotation.x = 0.34;

                [[-1, 0.52], [1, 0.52], [-1, -0.64], [1, -0.64]].forEach(([side, z]) => {
                    const front = z > 0;
                    const hipY = front ? 0.9 : 0.84;
                    const kneeY = front ? 0.52 : 0.48;
                    const ankleY = 0.14;

            function bindEvents() {
                window.addEventListener('resize', () => {
                    if (!renderer || !camera) return;
                    camera.aspect = window.innerWidth / window.innerHeight;
                    camera.updateProjectionMatrix();
                    renderer.setSize(window.innerWidth, window.innerHeight);
                });

                window.addEventListener('keydown', (e) => {
                    keysPressed[e.key.toLowerCase()] = true;
                });
                window.addEventListener('keyup', (e) => {
                    keysPressed[e.key.toLowerCase()] = false;
                });

                const dom = renderer.domElement;
                dom.addEventListener('pointerdown', (e) => {
                    isDragging = true;
                    dragMoved = false;
                    prevPointer.x = e.clientX;
                    prevPointer.y = e.clientY;
                });

                dom.addEventListener('pointermove', (e) => {
                    if (!isDragging) return;
                    const dx = e.clientX - prevPointer.x;
                    const dy = e.clientY - prevPointer.y;
                    if (Math.hypot(dx, dy) > 6) dragMoved = true;
                    orbitYaw -= dx * 0.0065;
                    prevPointer.x = e.clientX;
                    prevPointer.y = e.clientY;
                });

                dom.addEventListener('pointerup', (e) => {
                    const wasClick = !dragMoved;
                    isDragging = false;
                    if (!wasClick || state.paused) return;
                    const modalOpen = !document.getElementById('modal-backdrop').classList.contains('hidden');
                    if (modalOpen) return;
                    handleWorldTap(e.clientX, e.clientY);
                });
            }

            function handleWorldTap(clientX, clientY) {
                if (!webglReady) return;
                if (!['explore', 'mission'].includes(state.screen)) return;

                pointerNDC.x = (clientX / window.innerWidth) * 2 - 1;
                pointerNDC.y = -(clientY / window.innerHeight) * 2 + 1;
                raycaster.setFromCamera(pointerNDC, camera);

                const hits = raycaster.intersectObjects(interactiveTargets, false);
                if (!hits.length) return;

                let chosen = hits.find(h => h.object.userData.interactType === 'm1Object' && state.screen === 'mission' && state.activeMissionId === 1)
                          || hits.find(h => h.object.userData.interactType === 'landmark' && state.screen === 'explore')
                          || hits.find(h => h.object.userData.interactType === 'npc' && h.object.parent?.visible !== false && state.screen === 'explore')
                          || hits.find(h => h.object.name === 'ground');

                if (!chosen) return;
                const data = chosen.object.userData || {};

                if (data.interactType === 'm1Object' && state.screen === 'mission' && state.activeMissionId === 1) {
                    inspectMission1Object(data.objectId);
                    return;
                }
                if (data.interactType === 'landmark' && state.screen === 'explore') {
                    walkToLandmark(data.missionId, true);
                    return;
                }
                if (data.interactType === 'npc' && state.screen === 'explore') {
                    talkToNPC(data.npcId);
                    return;
                }
                if (chosen.object.name === 'ground' && state.screen === 'explore') {
                    setNavigationDestination(chosen.point.x, chosen.point.z);
                }
            }

            function movePlayerByVector(dx, dz) {
                if (!webglReady || state.screen !== 'explore') return;
                playerWaypoints = [];
                let nextX = playerPos.x + dx * 2.0;
                let nextZ = playerPos.z + dz * 2.0;
                const safeW = clampOutOfWater(nextX, nextZ);
                const safeO = clampOutOfObstacles(safeW.x, safeW.z);
                playerTarget.set(safeO.x, 0, safeO.z);
            }

            function setHoldMove(dx, dz) {
                if (dx === 0 && dz === 0) {
                    holdMoveVec = null;
                } else {
                    holdMoveVec = { dx, dz };
                    movePlayerByVector(dx, dz);
                }
            }

            function walkToLandmark(missionId, autoOpenModal = false) {
                const lm = LANDMARKS_CONFIG.find(l => l.id === missionId);
                if (!lm) return;
                AudioEngine.click();
                setNavigationDestination(lm.pos.x, lm.pos.z + 1.8);
                orbitYaw = 0;

                if (pendingLandmarkModalTimer) {
                    clearTimeout(pendingLandmarkModalTimer);
                    pendingLandmarkModalTimer = null;
                }

                if (autoOpenModal) {
                    const distToPos = Math.hypot(playerPos.x - lm.pos.x, playerPos.z - (lm.pos.z + 1.8));
                    const delay = distToPos < 3.5 ? 80 : 480;
                    pendingLandmarkModalTimer = setTimeout(() => {
                        if (state.screen !== 'explore') return;
                        const isUnlocked = state.unlockedMissions.includes(missionId);
                        if (isUnlocked) {
                            openLandmarkPromptModal(missionId);
                        } else {
                            showModal(`
                                <div class="text-center">
                                    <div class="w-16 h-16 rounded-2xl bg-gray-200 mx-auto flex items-center justify-center mb-3 text-gray-600">${IconSVG.lock("w-8 h-8")}</div>
                                    <h3 class="text-xl sm:text-2xl font-bold text-[#183629]">Pos ${missionId} Masih Terkunci</h3>
                                    <p class="mt-2 text-sm sm:text-base font-bold text-[#183629]/85">
                                        Selesaikan <strong>Pos ${missionId - 1}</strong> dulu ya!
                                    </p>
                                    <button onclick="closeModal()" class="btn-3d btn-green mt-5 w-full py-3 rounded-2xl font-extrabold text-base">
                                        Siap!
                                    </button>
                                </div>
                            `);
                        }
                    }, delay);
                }
            }

            function focusMission1Object(objectId) {
                const obj = MISSIONS_CONTENT[1].objects.find(o => o.id === objectId);
                if (!obj) return;
                playerWaypoints = [];
                const safe = clampOutOfObstacles(obj.pos.x, obj.pos.z + 1.6);
                playerTarget.set(safe.x, 0, safe.z);
                camGoalPos.set(obj.pos.x + 2.6, 3.6, obj.pos.z + 4.4);
                camGoalLook.set(obj.pos.x, 0.5, obj.pos.z);
            }

            function setCameraMode(mode) {
                camMode = mode;
                orbitYaw = 0;
                playerWaypoints = [];
                if (mode === 'characterPreview' || mode === 'story') {
                    playerPos.set(0, 0, 17);
                    playerTarget.set(0, 0, 17);
                    if (playerGroup) {
                        playerGroup.position.copy(playerPos);
                        playerGroup.rotation.y = 0;
                    }
                } else if (mode === 'mission1') {
                    playerTarget.set(-16, 0, 11.8);
                    camGoalPos.set(-16, 8.5, 20.5);
                    camGoalLook.set(-16, 0.5, 10);
                } else if (mode === 'mission5') {
                    playerTarget.set(14, 0, 14.8);
                    camGoalPos.set(14, 7.2, 22.5);
                    camGoalLook.set(14, 1.0, 13);
                }
            }

            function resetPlayerSpawn() {
                playerWaypoints = [];
                playerPos.set(0, 0, 17);
                playerTarget.set(0, 0, 17);
                if (playerGroup) {
                    playerGroup.position.copy(playerPos);
                    playerGroup.rotation.y = 0;
                }
            }

            function updateLandmarkVisuals() {
                if (!webglReady) return;
                LANDMARKS_CONFIG.forEach(lm => {
                    const m = landmarkMeshes[lm.id];
                    if (!m) return;
                    const done = state.completedMissions.includes(lm.id);
                    const unlocked = state.unlockedMissions.includes(lm.id);
                    const col = done ? 0x276749 : unlocked ? lm.color : 0x7E919B;
                    m.ring.material.color.setHex(col);
                    m.ring.material.emissive.setHex(col);
                    m.board.material.color.setHex(col);
                });

                if (state.activeMissionId === 1 && state.missionRuntime && state.missionRuntime.classifiedIds) {
                    Object.entries(mission1Meshes).forEach(([id, entry]) => {
                        const classified = state.missionRuntime.classifiedIds.includes(id);
                        entry.ring.material.color.setHex(classified ? 0x3B875B : 0xE6B84C);
                    });
                }

                if (mission5GardenGroup) {
                    const stageCount = (state.activeMissionId === 5 && state.missionRuntime)
                        ? state.missionRuntime.restoredCount
                        : (state.completedMissions.includes(5) ? 5 : 0);
                    mission5GardenGroup.children.forEach((crop, idx) => {
                        const targetS = idx < stageCount ? 1 : 0.01;
                        crop.scale.lerp(new THREE.Vector3(targetS, targetS, targetS), 0.12);
                    });
                }
            }

            function applyQualitySettings(quality) {
                if (!webglReady || !renderer) return;
                const enableShadows = quality !== 'low';
                if (scene.userData.sunLight) scene.userData.sunLight.castShadow = enableShadows;
                renderer.shadowMap.enabled = enableShadows;

                // Perbarui material di scene agar bayangan langsung aktif/nonaktif saat diganti di Pengaturan
                scene.traverse(obj => {
                    if (obj.isMesh && obj.material) {
                        obj.material.needsUpdate = true;
                    }
                });

                if (quality === 'low') {
                    renderer.setPixelRatio(1);
                    if (dustParticles) dustParticles.visible = false;
                    flowerMeshes.forEach(f => { f.visible = false; });
                } else if (quality === 'medium') {
                    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
                    if (dustParticles) dustParticles.visible = true;
                    flowerMeshes.forEach(f => { f.visible = true; });
                } else {
                    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
                    if (dustParticles) dustParticles.visible = true;
                    flowerMeshes.forEach(f => { f.visible = true; });
                }
            }

            function updateScreenMarkers() {
                const layer = document.getElementById('world-markers-layer');
                if (!layer) return;
                if (!webglReady || state.screen !== 'explore' || state.paused) {
                    layer.innerHTML = '';
                    return;
                }

                let html = '';
                LANDMARKS_CONFIG.forEach(lm => {
                    const worldPt = new THREE.Vector3(lm.pos.x, 2.7, lm.pos.z);
                    worldPt.project(camera);
                    if (worldPt.z > 1) return;
                    const sx = (worldPt.x * 0.5 + 0.5) * window.innerWidth;
                    const sy = (-worldPt.y * 0.5 + 0.5) * window.innerHeight;
                    if (sx < 20 || sx > window.innerWidth - 20 || sy < 65 || sy > window.innerHeight - 90) return;

                    const done = state.completedMissions.includes(lm.id);
                    const unlocked = state.unlockedMissions.includes(lm.id);
                    const bgClass = done ? 'bg-[#276749] text-[#FCF9F2] border-[#E6B84C]'
                                  : unlocked ? 'bg-[#E6B84C] text-[#183629] border-[#183629] animate-pulse-glow'
                                  : 'bg-gray-700/85 text-gray-200 border-gray-400';

                    html += `
                    <button onclick="ForestWorld3D.walkToLandmark(${lm.id}, true)"
                        style="left:${sx.toFixed(0)}px; top:${sy.toFixed(0)}px;"
                        class="world-callout ${bgClass} border-2 px-3 py-1 rounded-full font-extrabold text-xs shadow-lg whitespace-nowrap">
                        ${done ? '✓ ' : unlocked ? '★ ' : ''}${lm.shortTitle}
                    </button>`;
                });

                const npcList = [
                    { id: 'monkey', label: 'Monyet Ekor Panjang', pos: new THREE.Vector3(8.5, 3.1, 17.5), cls: 'bg-[#F5E8D6] text-[#603D2C] border-[#8A5B3C]' },
                    { id: 'bobi', label: 'Bobi (Rusa)', pos: new THREE.Vector3(-11.5, 2.9, -6.5), cls: 'bg-[#F5E8D6] text-[#8C4312] border-[#C06C2B]' },
                    { id: 'owl', label: 'Prof. Hantu', pos: new THREE.Vector3(4.8, 3.9, 5.2), cls: 'bg-[#DCEEF8] text-[#1D4E89] border-[#2B6CB0]' }
                ];
                if (state.characterId !== 'pak_joko') {
                    npcList.push({
                        id: 'pak_joko',
                        label: 'Pak Joko',
                        pos: new THREE.Vector3(-2.8, 3.0, 5.4),
                        cls: 'bg-[#EFE7D6] text-[#183629] border-[#556B2F]'
                    });
                }

                npcList.forEach(npc => {
                    const p = npc.pos.clone().project(camera);
                    if (p.z > 1) return;
                    const sx = (p.x * 0.5 + 0.5) * window.innerWidth;
                    const sy = (-p.y * 0.5 + 0.5) * window.innerHeight;
                    if (sx < 20 || sx > window.innerWidth - 20 || sy < 65 || sy > window.innerHeight - 90) return;

                    html += `
                    <button onclick="talkToNPC('${npc.id}')"
                        style="left:${sx.toFixed(0)}px; top:${sy.toFixed(0)}px;"
                        class="world-callout ${npc.cls} border-2 px-2.5 py-0.5 rounded-full font-extrabold text-[11px] shadow whitespace-nowrap">
                        ${npc.label}
                    </button>`;
                });

                layer.innerHTML = html;
            }

            function animate(frameTime = 0) {
                requestAnimationFrame(animate);
                if (!webglReady || !renderer || !scene || !camera) return;
                if (state.settings.quality === 'low') {
                    if (frameTime - lastRenderAt < 33) return;
                    lastRenderAt = frameTime;
                }

                const dt = Math.min(clock.getDelta(), 0.05);
                const elapsed = clock.getElapsedTime();

                if (!state.paused) {
                    if (state.screen === 'explore') {
                        const speed = 7.5 * dt;
                        let dx = 0;
                        let dz = 0;
                        if (keysPressed['w'] || keysPressed['arrowup']) dz -= speed;
                        if (keysPressed['s'] || keysPressed['arrowdown']) dz += speed;
                        if (keysPressed['a'] || keysPressed['arrowleft']) dx -= speed;
                        if (keysPressed['d'] || keysPressed['arrowright']) dx += speed;
                        if (holdMoveVec) {
                            dx += holdMoveVec.dx * speed;
                            dz += holdMoveVec.dz * speed;
                        }
                        if (dx !== 0 || dz !== 0) {
                            playerWaypoints = [];
                            const candX = playerPos.x + dx;
                            const candZ = playerPos.z + dz;
                            const safeW = clampOutOfWater(candX, candZ);
                            const safeO = clampOutOfObstacles(safeW.x, safeW.z);
                            playerTarget.set(safeO.x, 0, safeO.z);
                        }
                    }

                    const toTarget = new THREE.Vector3().subVectors(playerTarget, playerPos);
                    toTarget.y = 0;
                    const dist = toTarget.length();
                    const bridgeElev = isOnBridge(playerPos.x, playerPos.z) ? 0.36 : 0;

                    if (playerGroup) {
                        if (dist > 0.14) {
                            toTarget.normalize();
                            const step = Math.min(dist, 6.8 * dt);
                            const nextX = playerPos.x + toTarget.x * step;
                            const nextZ = playerPos.z + toTarget.z * step;

                            if (!isPointInWater(nextX, nextZ)) {
                                playerPos.x = nextX;
                                playerPos.z = nextZ;
                            } else {
                                playerWaypoints = [];
                                playerTarget.copy(playerPos);
                            }

                            playerGroup.position.x = playerPos.x;
                            playerGroup.position.z = playerPos.z;
                            playerGroup.rotation.y = Math.atan2(toTarget.x, toTarget.z);

                            const swing = Math.sin(elapsed * 12) * 0.55;
                            playerParts.leftLeg.rotation.x = swing;
                            playerParts.rightLeg.rotation.x = -swing;
                            playerParts.leftArm.rotation.x = -swing * 0.8;
                            playerParts.rightArm.rotation.x = swing * 0.8;
                            playerGroup.position.y = bridgeElev + Math.abs(Math.sin(elapsed * 12)) * 0.12;
                        } else if (playerWaypoints.length > 0) {
                            playerTarget.copy(playerWaypoints.shift());
                        } else {
                            playerParts.leftLeg.rotation.x *= 0.85;
                            playerParts.rightLeg.rotation.x *= 0.85;
                            playerParts.leftArm.rotation.x *= 0.85;
                            playerParts.rightArm.rotation.x = (camMode === 'characterPreview' || camMode === 'celebrate')
                                ? -2.4 + Math.sin(elapsed * 8) * 0.35
                                : playerParts.rightArm.rotation.x * 0.85;
                            playerGroup.position.y = bridgeElev + ((camMode === 'celebrate')
                                ? Math.abs(Math.sin(elapsed * 6)) * 0.55
                                : Math.sin(elapsed * 2.6) * 0.04);
                        }
                    }

                    // Animasi Rusa Bobi
                    if (deerParts.head) {
                        deerParts.head.rotation.y = Math.sin(elapsed * 1.4) * 0.25;
                        deerParts.tail.rotation.z = Math.sin(elapsed * 7) * 0.35;
                    }

                    // Animasi Monyet Ekor Panjang
                    if (monkeyParts.head) {
                        monkeyParts.head.rotation.y = Math.sin(elapsed * 1.9) * 0.28;
                        monkeyParts.head.rotation.z = Math.cos(elapsed * 1.5) * 0.08;
                        monkeyParts.tail.rotation.z = Math.sin(elapsed * 2.4) * 0.14;
                    }

                    // Animasi Prof. Hantu (Burung Hantu)
                    if (owlParts.leftWing) {
                        const flap = Math.sin(elapsed * 3.2) * 0.18;
                        owlParts.leftWing.rotation.z = 0.15 + flap;
                        owlParts.rightWing.rotation.z = -0.15 - flap;
                        owlParts.head.rotation.y = Math.sin(elapsed * 1.2) * 0.32;
                    }

                    // Animasi Pak Joko NPC
                    if (jokoNpcGroup && jokoNpcGroup.visible && jokoNpcParts.rightArm) {
                        jokoNpcParts.rightArm.rotation.x = (camMode === 'story' && state.storyStep === 1)
                            ? -2.3 + Math.sin(elapsed * 6) * 0.28
                            : Math.sin(elapsed * 2.1) * 0.08;
                    }

                    butterflies.forEach(b => {
                        b.mesh.position.x = b.basePos.x + Math.sin(elapsed * 1.6 + b.phase) * 1.4;
                        b.mesh.position.y = b.basePos.y + Math.sin(elapsed * 3.8 + b.phase) * 0.35;
                        b.mesh.position.z = b.basePos.z + Math.cos(elapsed * 1.5 + b.phase) * 1.4;
                    });

                    Object.values(mission1Meshes).forEach(entry => {
                        if (entry.group.userData.flameMesh) {
                            const f = entry.group.userData.flameMesh;
                            f.scale.y = 0.9 + Math.sin(elapsed * 14) * 0.18;
                            f.rotation.y = elapsed * 2;
                        }
                    });

                    treeGroups.forEach((tg, i) => {
                        tg.rotation.z = Math.sin(elapsed * 1.1 + i) * 0.015;
                    });

                    // Kamera perkenalan, cerita & eksplorasi
                    if (camMode === 'orbitWelcome') {
                        const a = elapsed * 0.16 + orbitYaw;
                        camGoalPos.set(Math.sin(a) * 26, 13.5, Math.cos(a) * 26);
                        camGoalLook.set(0, 2.2, 2);
                    } else if (camMode === 'characterPreview') {
                        camGoalPos.set(Math.sin(orbitYaw) * 4.4, 2.3, 17 + Math.cos(orbitYaw) * 4.4);
                        camGoalLook.set(0, 1.35, 17);
                    } else if (camMode === 'story') {
                        const isJoko = state.characterId === 'pak_joko';
                        if (state.storyStep === 0 || (isJoko && state.storyStep === 4)) {
                            camGoalPos.set(1.6, 2.6, 21.6);
                            camGoalLook.set(0, 1.35, 17);
                        } else if (!isJoko && state.storyStep === 1) {
                            camGoalPos.set(-2.2, 2.6, 9.6);
                            camGoalLook.set(-2.8, 1.45, 5.4);
                        } else if ((isJoko && state.storyStep === 1) || (!isJoko && state.storyStep === 2)) {
                            camGoalPos.set(6.4, 3.1, 21.8);
                            camGoalLook.set(8.5, 1.65, 17.5);
                        } else if ((isJoko && state.storyStep === 2) || (!isJoko && state.storyStep === 3)) {
                            camGoalPos.set(-7.5, 3.2, -2.2);
                            camGoalLook.set(-11.5, 1.4, -6.5);
                        } else if ((isJoko && state.storyStep === 3) || (!isJoko && state.storyStep === 4)) {
                            camGoalPos.set(6.9, 3.5, 8.6);
                            camGoalLook.set(4.8, 2.65, 5.2);
                        }
                    } else if (camMode === 'explore') {
                        const radius = 15.5;
                        camGoalPos.set(
                            playerPos.x + Math.sin(orbitYaw) * radius,
                            11.5,
                            playerPos.z + Math.cos(orbitYaw) * radius
                        );
                        camGoalLook.set(playerPos.x, 1.1, playerPos.z - 1.5);
                    } else if (camMode === 'celebrate') {
                        const a = elapsed * 0.6;
                        camGoalPos.set(playerPos.x + Math.sin(a) * 5.2, 2.8, playerPos.z + Math.cos(a) * 5.2);
                        camGoalLook.set(playerPos.x, 1.4, playerPos.z);
                    }

                    camera.position.lerp(camGoalPos, 0.08);
                    camCurrentLook.lerp(camGoalLook, 0.1);
                    camera.lookAt(camCurrentLook);

                    updateLandmarkVisuals();
                    updateScreenMarkers();
                }

                renderer.render(scene, camera);
            }

            return {
                init,
                buildPlayerCharacter,
                setCameraMode,
                walkToLandmark,
                movePlayerByVector,
                setHoldMove,
                focusMission1Object,
                applyQualitySettings,
                resetPlayerSpawn
            };
        })();

        /**
         * ============================================================================
         * 7. NAVIGASI 12 TAHAP ALUR PERMAINAN
         * ============================================================================
         */
        function navigateTo(screen, missionId = null) {
            AudioEngine.click();
            state.screen = screen;
            state.paused = false;

            if (missionId) {
                state.activeMissionId = missionId;
                initMissionRuntime(missionId);
            }
            if (screen === 'pretest') {
                initTestRuntime('pre');
            }
            if (screen === 'posttest') {
                initTestRuntime('post');
            }

            if (screen === 'welcome' || screen === 'name' || screen === 'tutorial') {
                ForestWorld3D.setCameraMode('orbitWelcome');
            } else if (screen === 'character') {
                ForestWorld3D.setCameraMode('characterPreview');
            } else if (screen === 'story') {
                ForestWorld3D.setCameraMode('story');
            } else if (screen === 'explore') {
                ForestWorld3D.setCameraMode('explore');
            } else if (screen === 'mission') {
                if (missionId === 1) ForestWorld3D.setCameraMode('mission1');
                else if (missionId === 5) ForestWorld3D.setCameraMode('mission5');
                else ForestWorld3D.setCameraMode('explore');
            } else if (screen === 'achievements') {
                ForestWorld3D.setCameraMode('celebrate');
            } else {
                ForestWorld3D.setCameraMode('orbitWelcome');
            }

            updateHUD();
            renderScreen();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function updateHUD() {
            const hud = document.getElementById('top-hud');
            const hideOn = ['welcome', 'name', 'character', 'tutorial', 'educator'];
            if (hideOn.includes(state.screen)) {
                hud.classList.add('hidden');
                return;
            }
            hud.classList.remove('hidden');

            document.getElementById('hud-icon-compass').innerHTML = IconSVG.compass("w-4 h-4");
            document.getElementById('hud-icon-chart').innerHTML = IconSVG.chart("w-4 h-4");
            document.getElementById('hud-icon-star').innerHTML = IconSVG.star("w-4 h-4");
            document.getElementById('hud-icon-badge').innerHTML = IconSVG.badge("w-4 h-4");
            document.getElementById('hud-icon-pause').innerHTML = IconSVG.pause("w-4 h-4");
            document.getElementById('hud-icon-gear').innerHTML = IconSVG.gear("w-4 h-4");

            const name = state.playerName.trim() || 'Penjaga Hutan';
            document.getElementById('hud-player-label').textContent = name;
            const doneCount = state.completedMissions.length;
            document.getElementById('hud-progress-label').textContent = `${doneCount} / 5 Pos`;
            document.getElementById('hud-progress-bar').style.width = `${(doneCount / 5) * 100}%`;
            document.getElementById('hud-score').textContent = state.score;
            document.getElementById('hud-badge-count').textContent = doneCount;
        }

        function renderScreen() {
            const container = document.getElementById('screen-container');
            switch (state.screen) {
                case 'welcome': container.innerHTML = renderWelcomeScreen(); break;
                case 'name': container.innerHTML = renderNameScreen(); break;
                case 'character': container.innerHTML = renderCharacterScreen(); break;
                case 'tutorial': container.innerHTML = renderTutorialScreen(); break;
                case 'pretest': container.innerHTML = renderTestScreen('pre'); break;
                case 'story': container.innerHTML = renderStoryScreen(); break;
                case 'explore': container.innerHTML = renderExploreHUD(); break;
                case 'mission': container.innerHTML = renderMissionScreen(); break;
                case 'posttest': container.innerHTML = renderTestScreen('post'); break;
                case 'achievements': container.innerHTML = renderAchievementsScreen(); break;
                case 'report': container.innerHTML = renderReportScreen(); break;
                case 'educator': container.innerHTML = renderEducatorDashboard(); break;
            }
        }

        /**

         * ============================================================================
