        function initTestRuntime(type) {
            const shuffledQuestions = ASSESSMENT_BANK[type].map(q => ({
                ...q,
                options: shuffleArray(q.options)
            }));
            state.testRuntime = {
                type,
                questions: shuffledQuestions,
                qIndex: 0,
                selectedIdx: null,
                answers: [],
                finished: false
            };
        }

        function renderPreTestImagePlaceholder(questionNumber) {
            const basePath = `assets/kuis-awal-soal-${questionNumber}`;
            return `
                <div class="mission-art mb-3">
                    <picture>
                        <source srcset="${basePath}.gif" type="image/gif">
                        <img
                            src="${basePath}.jpg"
                            alt="Placeholder visual kuis awal soal ${questionNumber}"
                            class="w-full rounded-2xl border-2 border-[#8FB899]/70 bg-[#DCEEF8] object-cover"
                            style="aspect-ratio: 320 / 145;"
                            onerror="this.style.display='none'; this.nextElementSibling.classList.remove('hidden');"
                        >
                    </picture>
                    <div class="hidden rounded-2xl border-2 border-dashed border-[#6BAED6] bg-[#EAF6FD] text-[#183629] px-4 py-6 text-center font-extrabold text-sm sm:text-base">
                        Placeholder gambar kuis awal soal ${questionNumber}<br>
                        Simpan file: ${basePath}.gif atau ${basePath}.jpg
                    </div>
                </div>`;
        }

        function renderTestScreen(type) {
            if (!state.testRuntime || state.testRuntime.type !== type) {
                initTestRuntime(type);
            }
            const rt = state.testRuntime;
            const isPre = type === 'pre';

            if (isPre && rt.finished) {
                return `
                <section class="flex-1 flex items-center justify-center p-4 interactive-panel animate-pop">
                    <div class="game-panel rounded-3xl max-w-xl w-full p-6 sm:p-8 text-center">
                        <div class="w-16 h-16 rounded-2xl bg-[#DCEEF8] border-3 border-[#2B6CB0] mx-auto flex items-center justify-center mb-3">
                            ${IconSVG.check("w-9 h-9 text-[#2B6CB0]")}
                        </div>
                        <span class="bg-[#6BAED6] text-[#183629] text-xs font-extrabold px-4 py-1 rounded-full">
                            KUIS AWAL SELESAI
                        </span>
                        <h2 class="text-2xl sm:text-3xl font-bold text-[#183629] mt-2">Skor Awal: ${state.preTest.score} / 100</h2>
                        <p class="text-base font-extrabold text-[#1D4E89] mt-1">
                            (${state.preTest.correctCount} dari 5 Soal Benar)
                        </p>
                        <p class="mt-4 text-sm sm:text-base font-bold text-[#183629] card-surface p-4 rounded-2xl border-2 border-[#689F77]">
                            Bagus! Sekarang ayo dengar cerita sahabat hutan Dusun Cuntel.
                        </p>
                        <button onclick="startStoryFromPreTest()" class="btn-3d btn-green mt-6 w-full py-4 rounded-2xl font-extrabold text-lg">
                            Masuk ke Cerita Hutan 3D →
                        </button>
                    </div>
                </section>`;
            }

            const bank = rt.questions;
            const q = bank[rt.qIndex];
            const ind = LEARNING_INDICATORS.find(item => item.id === q.indicatorId);

            return `
            <section class="flex-1 flex items-center justify-center p-3 sm:p-4 interactive-panel animate-pop">
                <div class="game-panel rounded-3xl max-w-2xl w-full p-4 sm:p-6">
                    <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
                        <span class="${isPre ? 'bg-[#2B6CB0]' : 'bg-[#276749]'} text-[#FCF9F2] text-xs font-extrabold px-3.5 py-1 rounded-full">
                            ${isPre ? 'KUIS AWAL' : 'KUIS AKHIR'} • Soal ${rt.qIndex + 1} / ${bank.length}
                        </span>
                        <span class="bg-[#F6F1E3] border-2 border-[#E6B84C] text-[#183629] text-xs font-extrabold px-3 py-1 rounded-full">
                            ${ind.name}
                        </span>
                    </div>

                    <div class="flex gap-2 mb-3">
                        ${bank.map((_, idx) => `
                            <span class="h-2.5 flex-1 rounded-full ${idx < rt.qIndex ? 'bg-[#276749]' : idx === rt.qIndex ? 'bg-[#E6B84C] ring-2 ring-[#183629]' : 'bg-[#689F77]/35'}"></span>
                        `).join('')}
                    </div>

                    ${isPre ? renderPreTestImagePlaceholder(rt.qIndex + 1) : (q.illustration ? `<div class="mission-art mb-3">${IconSVG.sceneArt(q.illustration)}</div>` : '')}

                    <div class="card-surface border-3 border-[#E6B84C] rounded-2xl p-3.5 sm:p-4 mb-3.5 text-center">
                        <h3 class="text-lg sm:text-xl font-extrabold text-[#183629] leading-snug">${q.question}</h3>
                    </div>

                    <div class="space-y-2.5">
                        ${q.options.map((opt, idx) => {
                            const selected = rt.selectedIdx === idx;
                            const letters = ['A', 'B', 'C'];
                            return `
                            <button onclick="selectTestAnswer(${idx})"
                                class="btn-3d w-full border-3 p-3 sm:p-3.5 rounded-2xl text-left font-extrabold text-sm sm:text-base flex items-center gap-3 ${
                                    selected ? 'bg-[#E6B84C]/40 border-[#183629]' : 'card-surface hover:bg-[#F6F1E3] border-[#276749]/35'
                                }">
                                <span class="w-9 h-9 rounded-xl ${selected ? 'bg-[#183629] text-[#F0C96B]' : 'bg-[#276749] text-[#FCF9F2]'} flex items-center justify-center shrink-0 font-title">
                                    ${letters[idx]}
                                </span>
                                <span class="flex-1">${opt.text}</span>
                            </button>`;
                        }).join('')}
                    </div>

                    <div class="mt-5 flex justify-end">
                        <button onclick="nextTestStep()" ${rt.selectedIdx === null ? 'disabled' : ''}
                            class="btn-3d ${isPre ? 'btn-blue' : 'btn-green'} py-3.5 px-7 rounded-2xl font-extrabold text-base">
                            ${rt.qIndex + 1 < bank.length ? 'Lanjut →' : (isPre ? 'Selesai Kuis Awal →' : 'Lihat Hasil Belajar →')}
                        </button>
                    </div>
                </div>
            </section>`;
        }

        function selectTestAnswer(idx) {
            AudioEngine.click();
            state.testRuntime.selectedIdx = idx;
            renderScreen();
        }

        function nextTestStep() {
            const rt = state.testRuntime;
            if (!rt || rt.selectedIdx === null) return;
            const bank = rt.questions;
            const isCorrect = Boolean(bank[rt.qIndex].options[rt.selectedIdx].isCorrect);
            rt.answers.push(isCorrect);

            if (rt.qIndex + 1 < bank.length) {
                AudioEngine.click();
                rt.qIndex++;
                rt.selectedIdx = null;
                renderScreen();
            } else {
                const correctCount = rt.answers.filter(Boolean).length;
                const score = Math.round((correctCount / bank.length) * 100);
                if (rt.type === 'pre') {
                    AudioEngine.correct();
                    state.preTest = { completed: true, answers: [...rt.answers], score, correctCount };
                    rt.finished = true;
                    syncCurrentParticipantRecord();
                    renderScreen();
                } else {
                    AudioEngine.fanfare();
                    state.postTest = { completed: true, answers: [...rt.answers], score, correctCount };
                    rt.finished = true;
                    syncCurrentParticipantRecord();
                    launchConfetti();
                    navigateTo('report');
                }
            }
        }

        function startStoryFromPreTest() {
            state.storyStep = 0;
            navigateTo('story');
        }

         */
        function initMissionRuntime(mId) {
            if (state.missionRuntime && state.missionRuntime.autoNextTimer) {
                clearTimeout(state.missionRuntime.autoNextTimer);
            }
            if (mId === 1) {
                state.missionRuntime = {
                    selectedObjectId: MISSIONS_CONTENT[1].objects[0].id,
                    classifiedIds: [],
                    feedback: null,
                    earnedPoints: 0,
                    completed: false,
                    autoNextTimer: null
                };
                setTimeout(() => ForestWorld3D.focusMission1Object(MISSIONS_CONTENT[1].objects[0].id), 150);
            } else if (mId === 2) {
                const pairs = MISSIONS_CONTENT[2].pairs;
                const orderedPairs = pairs.map(pair => {
                    const builtInOptions = Array.isArray(pair.options) && pair.options.length
                        ? pair.options
                        : [
                            { text: pair.description, isCorrect: true },
                            ...shuffleArray(pairs.filter(option => option.id !== pair.id))
                                .slice(0, 2)
                                .map(option => ({ text: option.description, isCorrect: false }))
                        ];
                    return {
                        ...pair,
                        options: shuffleArray(builtInOptions.map(option => ({ ...option })))
                    };
                });
                state.missionRuntime = {
                    pairs: orderedPairs,
                    index: 0,
                    selectedOpt: null,
                    answered: false,
                    feedback: null,
                    earnedPoints: 0,
                    completed: false
                };
            } else if (mId === 3 || mId === 4) {
                const shuffledScenarios = MISSIONS_CONTENT[mId].scenarios.map(s => ({
                    ...s,
                    options: shuffleArray(s.options)
                }));
                state.missionRuntime = {
                    scenarios: shuffledScenarios,
                    index: 0,
                    selectedOpt: null,
                    answered: false,
                    showHint: false,
                    feedback: null,
                    earnedPoints: 0,
                    completed: false
                };
            } else if (mId === 5) {
                const shuffledStages = MISSIONS_CONTENT[5].stages.map(st => ({
                    ...st,
                    options: shuffleArray(st.options)
                }));
                state.missionRuntime = {
                    stages: shuffledStages,
                    index: 0,
                    restoredCount: 0,
                    selectedOpt: null,
                    answered: false,
                    showHint: false,
                    feedback: null,
                    earnedPoints: 0,
                    completed: false
                };
            }
        }

            const mId = state.activeMissionId;
            const mData = MISSIONS_CONTENT[mId];
            const rt = state.missionRuntime;

            if (rt.completed) {
                return renderMissionCompleteView(mData, rt);
            }

            if (mId === 1) return renderMission1View(mData, rt);
            if (mId === 2) return renderMission2View(mData, rt);
            if (mId === 3 || mId === 4) return renderDecisionMissionView(mData, rt);
            return renderMission5View(mData, rt);
        }

        function inspectMission1Object(objectId) {
            AudioEngine.discover();
            const rt = state.missionRuntime;
            if (rt.autoNextTimer) {
                clearTimeout(rt.autoNextTimer);
                rt.autoNextTimer = null;
            }
            rt.selectedObjectId = objectId;
            rt.feedback = null;
            ForestWorld3D.focusMission1Object(objectId);
            renderScreen();
        }

        function classifyMission1Object(playerSaysDanger) {
            const rt = state.missionRuntime;
            const objs = MISSIONS_CONTENT[1].objects;
            const activeObj = objs.find(o => o.id === rt.selectedObjectId);
            if (!activeObj || rt.classifiedIds.includes(activeObj.id)) return;

            if (rt.autoNextTimer) {
                clearTimeout(rt.autoNextTimer);
                rt.autoNextTimer = null;
            }

            if (activeObj.isDanger === playerSaysDanger) {
                AudioEngine.correct();
                rt.classifiedIds.push(activeObj.id);
                rt.earnedPoints += 20;
                rt.feedback = {
                    isCorrect: true,
                    title: "Benar! (+20 Poin)",
                    text: activeObj.explanation
                };

                if (rt.classifiedIds.length === objs.length) {
                    rt.autoNextTimer = setTimeout(() => {
                        if (state.screen === 'mission' && state.activeMissionId === 1 && !rt.completed) {
                            finishMission(1);
                        }
                    }, 900);
                } else {
                    const nextObj = objs.find(o => !rt.classifiedIds.includes(o.id));
                    if (nextObj) {
                        rt.autoNextTimer = setTimeout(() => {
                            if (state.screen === 'mission' && state.activeMissionId === 1 && !rt.completed) {
                                rt.selectedObjectId = nextObj.id;
                                ForestWorld3D.focusMission1Object(nextObj.id);
                                renderScreen();
                            }
                        }, 1050);
                    }
                }
            } else {
                AudioEngine.retry();
                rt.feedback = {
                    isCorrect: false,
                    title: "Ayo Amati Gambarnya Lagi!",
                    text: activeObj.isDanger
                        ? "Lihat percikan api atau bara di dekat daun kering."
                        : "Benda ini tidak punya api dan menjaga hutan tetap hijau!"
                };
            }
            renderScreen();
        }

        function finishMission(mId) {
            AudioEngine.fanfare();
            const rt = state.missionRuntime;
            rt.completed = true;

            const prevBest = state.missionBestScores[mId] || 0;
            if (rt.earnedPoints > prevBest) {
                state.score += (rt.earnedPoints - prevBest);
                state.missionBestScores[mId] = rt.earnedPoints;
            }
            if (!state.completedMissions.includes(mId)) {
                state.completedMissions.push(mId);
            }
            if (mId < 5 && !state.unlockedMissions.includes(mId + 1)) {
                state.unlockedMissions.push(mId + 1);
            }

            syncCurrentParticipantRecord();
            updateHUD();
            launchConfetti();
            renderScreen();

                    <div class="bg-[#E6B84C]/30 border-2 border-[#E6B84C] rounded-2xl p-4 text-center mb-5">
                        <p class="text-sm sm:text-base font-extrabold text-[#183629]">${summaryText}</p>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                        ${!postDone && state.completedMissions.length === 5 ? `
                            <button onclick="navigateTo('posttest')" class="btn-3d btn-yellow py-3.5 rounded-2xl font-extrabold text-sm sm:text-base">
                                Kerjakan Kuis Akhir →
                            </button>
                        ` : `
                            <button onclick="navigateTo('achievements')" class="btn-3d btn-yellow py-3.5 rounded-2xl font-extrabold text-sm sm:text-base">
                                Lihat Lencana
                            </button>
                        `}
                        <button onclick="navigateTo('explore')" class="btn-3d btn-green py-3.5 rounded-2xl font-extrabold text-sm sm:text-base">
                            Kembali ke Hutan 3D
                        </button>
                        <button onclick="resetFullSession()" class="btn-3d btn-cream py-3.5 rounded-2xl font-extrabold text-sm sm:text-base">
                            Siswa Baru / Ulangi
                        </button>
                    </div>
                </div>
            </section>`;
        }

        function resetFullSession() {
            AudioEngine.click();
            state.playerName = '';
            state.currentSessionId = 'session-' + Date.now();
            state.tutorialStep = 0;
            state.storyStep = 0;
            state.unlockedMissions = [1];
            state.completedMissions = [];
            state.missionBestScores = {};
            state.score = 0;
            state.activeMissionId = null;
            state.missionRuntime = null;
            state.preTest = { completed: false, answers: [], score: 0, correctCount: 0 };
            state.postTest = { completed: false, answers: [], score: 0, correctCount: 0 };
            state.testRuntime = null;
            ForestWorld3D.resetPlayerSpawn();
            navigateTo('welcome');
        }

        /**
         * ============================================================================
         * 14. LAYAR 12: DASBOR PENDIDIK / GURU SD DUSUN CUNTEL
         * ============================================================================
         */
        function openEducatorGateModal() {
            AudioEngine.click();
            showModal(`
                <div class="text-center">
                    <div class="w-16 h-16 rounded-2xl bg-[#DCEEF8] border-3 border-[#2B6CB0] mx-auto flex items-center justify-center mb-3 text-[#2B6CB0]">
                        ${IconSVG.educator("w-9 h-9")}
                    </div>
                    <h3 class="text-xl sm:text-2xl font-bold text-[#183629]">Akses Pendidik</h3>
                    <p class="mt-2 text-xs sm:text-sm font-bold text-[#183629]/80">
                        Masukkan kode pendidik untuk melihat rekap nilai siswa. (Kode: <strong>1945</strong>)
                    </p>
                    <input id="educator-pin-input" type="password" inputmode="numeric" maxlength="6" placeholder="••••"
                        onkeydown="if(event.key==='Enter') verifyEducatorPin()"
                        class="mt-4 w-44 text-center text-2xl font-extrabold tracking-widest card-surface border-3 border-[#276749] rounded-2xl py-2.5 px-4">
                    <p id="educator-pin-error" class="text-xs font-extrabold text-[#C95B49] mt-2 hidden">Kode salah. Coba masukkan 1945.</p>
                    <div class="mt-5 grid grid-cols-2 gap-3">
                        <button onclick="closeModal()" class="btn-3d btn-cream py-3 rounded-2xl font-extrabold">Batal</button>
                        <button onclick="verifyEducatorPin()" class="btn-3d btn-blue py-3 rounded-2xl font-extrabold">Masuk</button>
                    </div>
                </div>
            `);
        }

        function verifyEducatorPin() {
            const val = (document.getElementById('educator-pin-input')?.value || '').trim();
            if (val === '1945') {
                closeModal();
                navigateTo('educator');
            } else {
                AudioEngine.retry();
                document.getElementById('educator-pin-error')?.classList.remove('hidden');
            }
        }

        function renderEducatorDashboard() {
            const list = state.participants;
            const completedBoth = list.filter(p => p.preScore !== null && p.postScore !== null);
            const avgPre = list.filter(p => p.preScore !== null).reduce((acc, p, _, a) => acc + p.preScore / a.length, 0);
            const avgPost = list.filter(p => p.postScore !== null).reduce((acc, p, _, a) => acc + p.postScore / a.length, 0);
            const avgGain = completedBoth.reduce((acc, p, _, a) => acc + (p.postScore - p.preScore) / a.length, 0);

            return `
            <section class="flex-1 p-4 sm:p-6 max-w-5xl mx-auto w-full interactive-panel animate-pop">
                <div class="game-panel rounded-3xl p-5 sm:p-7">
                    <div class="flex flex-wrap items-center justify-between gap-3 mb-5">
                        <div>
                            <span class="bg-[#2B6CB0] text-[#FCF9F2] text-xs font-extrabold px-3.5 py-1 rounded-full">
                                DASBOR PENDIDIK • SD DUSUN CUNTEL
                            </span>
                            <h2 class="text-2xl sm:text-3xl font-bold text-[#183629] mt-1">Rekap Hasil Belajar Siswa</h2>
                        </div>
                        <div class="flex flex-wrap gap-2">
                            <button onclick="exportParticipantsCSV()" class="btn-3d btn-green px-4 py-2.5 rounded-2xl text-xs sm:text-sm font-extrabold">
                                Unduh CSV
                            </button>
                            ${list.length > 0 ? `
                                <button onclick="confirmClearParticipants()" class="btn-3d btn-orange px-4 py-2.5 rounded-2xl text-xs sm:text-sm font-extrabold flex items-center gap-1.5">
                                    ${IconSVG.trash("w-4 h-4")}
                                    <span>Hapus Rekap</span>
                                </button>
                            ` : ''}
                            <button onclick="navigateTo('welcome')" class="btn-3d btn-cream px-4 py-2.5 rounded-2xl text-xs sm:text-sm font-extrabold">
                                ← Beranda
                            </button>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-6">
                        <div class="card-surface border-2 border-[#689F77] rounded-2xl p-3.5 text-center">
                            <span class="text-xs font-extrabold text-[#183629]/75">Jumlah Siswa</span>
                            <div class="text-2xl sm:text-3xl font-bold text-[#183629] mt-1">${list.length}</div>
                        </div>
                        <div class="bg-[#DCEEF8] border-2 border-[#2B6CB0] rounded-2xl p-3.5 text-center">
                            <span class="text-xs font-extrabold text-[#1D4E89]">Rata-rata Kuis Awal</span>
                            <div class="text-2xl sm:text-3xl font-bold text-[#183629] mt-1">${list.some(p => p.preScore !== null) ? avgPre.toFixed(1) : '-'}</div>
                        </div>
                        <div class="bg-[#DFECE3] border-2 border-[#276749] rounded-2xl p-3.5 text-center">
                            <span class="text-xs font-extrabold text-[#276749]">Rata-rata Kuis Akhir</span>
                            <div class="text-2xl sm:text-3xl font-bold text-[#183629] mt-1">${list.some(p => p.postScore !== null) ? avgPost.toFixed(1) : '-'}</div>
                        </div>
                        <div class="bg-[#F5E8D6] border-2 border-[#C06C2B] rounded-2xl p-3.5 text-center">
                            <span class="text-xs font-extrabold text-[#8C4312]">Rata-rata Kenaikan</span>
                            <div class="text-2xl sm:text-3xl font-bold text-[#183629] mt-1">${completedBoth.length ? (avgGain >= 0 ? `+${avgGain.toFixed(1)}` : avgGain.toFixed(1)) : '-'}</div>
                        </div>
                    </div>

                    <div class="overflow-x-auto card-surface rounded-2xl border-2 border-[#689F77]">
                        <table class="w-full text-left border-collapse text-xs sm:text-sm">
                            <thead>
                                <tr class="bg-[#276749] text-[#FCF9F2]">
                                    <th class="p-3 font-extrabold">Kode Siswa</th>
                                    <th class="p-3 font-extrabold">Kelas</th>
                                    <th class="p-3 font-extrabold">Kuis Awal</th>
                                    <th class="p-3 font-extrabold">Kuis Akhir</th>
                                    <th class="p-3 font-extrabold">Selisih</th>
                                    <th class="p-3 font-extrabold">Pos</th>
                                    <th class="p-3 font-extrabold">Waktu</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${list.length === 0 ? `
                                    <tr>
                                        <td colspan="7" class="p-6 text-center font-bold text-[#183629]/75">
                                            Belum ada data siswa tersimpan di perangkat ini.
                                        </td>
                                    </tr>
                                ` : list.map(p => {
                                    const diff = (p.preScore !== null && p.postScore !== null) ? (p.postScore - p.preScore) : null;
                                    return `
                                    <tr class="border-b border-[#689F77]/30 hover:bg-[#F6F1E3]">
                                        <td class="p-3 font-extrabold text-[#183629]">${escapeHtml(p.name)}</td>
                                        <td class="p-3 font-bold text-[#183629]/80">${escapeHtml(p.group)}</td>
                                        <td class="p-3 font-extrabold text-[#1D4E89]">${p.preScore !== null ? p.preScore : '-'}</td>
                                        <td class="p-3 font-extrabold text-[#276749]">${p.postScore !== null ? p.postScore : '-'}</td>
                                        <td class="p-3 font-extrabold ${diff !== null && diff > 0 ? 'text-[#276749]' : 'text-gray-600'}">
                                            ${diff !== null ? (diff >= 0 ? `+${diff}` : diff) : '-'}
                                        </td>
                                        <td class="p-3 font-bold">${p.completedMissions}/5</td>
                                        <td class="p-3 text-xs font-bold text-gray-600">${escapeHtml(p.timestamp)}</td>
                                    </tr>`;
                                }).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>`;
        }

        function confirmClearParticipants() {
            AudioEngine.click();
            showModal(`
                <div class="text-center">
                    <div class="w-16 h-16 rounded-2xl bg-[#FBE4DC] border-3 border-[#B94A38] mx-auto flex items-center justify-center mb-3 text-[#B94A38]">
                        ${IconSVG.trash("w-8 h-8")}
                    </div>
                    <h3 class="text-xl sm:text-2xl font-bold text-[#183629]">Hapus Semua Rekap?</h3>
                    <p class="mt-2 text-sm sm:text-base font-bold text-[#183629]/85">
                        Semua data nilai siswa di perangkat ini akan dihapus. Pastikan sudah mengunduh CSV jika diperlukan.
                    </p>
                    <div class="mt-5 grid grid-cols-2 gap-3">
                        <button onclick="closeModal()" class="btn-3d btn-cream py-3 rounded-2xl font-extrabold">Batal</button>
                        <button onclick="clearParticipantsNow()" class="btn-3d btn-orange py-3 rounded-2xl font-extrabold">Ya, Hapus</button>
                    </div>
                </div>
            `);
        }

        function clearParticipantsNow() {
            AudioEngine.click();
            state.participants = [];
            saveParticipantRecords();
            closeModal();
            renderScreen();
        }

        function exportParticipantsCSV() {
            AudioEngine.click();
            const headers = ["Kode_Siswa", "Kelas", "Karakter", "Skor_Kuis_Awal", "Skor_Kuis_Akhir", "Selisih", "Pos_Selesai", "Poin_Game", "Waktu"];
            const rows = state.participants.map(p => {
                const diff = (p.preScore !== null && p.postScore !== null) ? (p.postScore - p.preScore) : "";
                return [
                    `"${p.name.replace(/"/g, '""')}"`,
                    `"${p.group.replace(/"/g, '""')}"`,
                    `"${p.character}"`,
                    p.preScore !== null ? p.preScore : "",
                    p.postScore !== null ? p.postScore : "",
                    diff,
                    p.completedMissions,
                    p.gameScore,
                    `"${p.timestamp}"`
                ].join(",");
            });
            const csv = [headers.join(","), ...rows].join("\n");
            const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = "rekap_misi_penjaga_hutan_cuntel.csv";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        /**
         * ============================================================================
         * 15. MODAL JEDA, PENGATURAN, CARA BERMAIN & KONFETI
         * ============================================================================
         */
        function showModal(html) {
            document.getElementById('modal-content').innerHTML = html;
            document.getElementById('modal-backdrop').classList.remove('hidden');
        }

        function closeModal() {
            AudioEngine.click();
            state.paused = false;
            document.getElementById('modal-backdrop').classList.add('hidden');
        }

        function openPauseModal() {
            AudioEngine.click();
            state.paused = true;
            showModal(`
                <div class="text-center">
                    <div class="w-16 h-16 rounded-2xl bg-[#E6B84C]/35 border-3 border-[#E6B84C] mx-auto flex items-center justify-center mb-3">
                        ${IconSVG.pause("w-8 h-8")}
                    </div>
                    <h3 class="text-2xl font-bold text-[#183629]">Permainan Dijeda</h3>
                    <div class="mt-5 flex flex-col gap-3">
                        <button onclick="closeModal()" class="btn-3d btn-green w-full py-3.5 rounded-2xl font-extrabold text-base">
                            ▶ Lanjutkan Bermain
                        </button>
                        <button onclick="closeModal(); navigateTo('explore')" class="btn-3d btn-blue w-full py-3.5 rounded-2xl font-extrabold text-base">
                            Ke Peta Hutan 3D
                        </button>
                        <button onclick="closeModal(); navigateTo('welcome')" class="btn-3d btn-cream w-full py-3.5 rounded-2xl font-extrabold text-base">
                            Keluar ke Layar Awal
                        </button>
                    </div>
                </div>
            `);
        }

        function openHowToPlayModal() {
            AudioEngine.click();
            showModal(`
                <div>
                    <h3 class="text-xl sm:text-2xl font-bold text-[#183629] text-center">Cara Bermain</h3>
                    <div class="mt-4 space-y-2.5 text-xs sm:text-sm font-bold text-[#183629]">
                        <div class="p-3 rounded-2xl bg-[#DFECE3] border-2 border-[#276749]">
                            <strong>1. Jelajah Hutan 3D:</strong> Ketuk tanah atau Pos Misi untuk berjalan. Geser layar untuk memutar kamera.
                        </div>
                        <div class="p-3 rounded-2xl bg-[#DCEEF8] border-2 border-[#2B6CB0]">
                            <strong>2. Kuis Awal & Akhir:</strong> Jawab 5 soal bergambar sebelum dan sesudah misi.
                        </div>
                        <div class="p-3 rounded-2xl bg-[#F5E8D6] border-2 border-[#C06C2B]">
                            <strong>3. Selesaikan 5 Pos:</strong> Kumpulkan semua lencana untuk menjadi Penjaga Hutan Utama!
                        </div>
                    </div>
                    <button onclick="closeModal()" class="btn-3d btn-green mt-5 w-full py-3.5 rounded-2xl font-extrabold text-base">
                        Siap Bermain!
                    </button>
                </div>
            `);
        }

        function openSettingsModal() {
            AudioEngine.click();
            const q = state.settings.quality;
            showModal(`
                <div>
                    <h3 class="text-xl sm:text-2xl font-bold text-[#183629] text-center">Pengaturan</h3>
                    <div class="mt-4 space-y-4">
                        <div class="card-surface p-3.5 rounded-2xl border-2 border-[#689F77]">
                            <span class="block text-xs font-extrabold text-[#183629] mb-2">Kualitas Grafis 3D:</span>
                            <div class="grid grid-cols-3 gap-2">
                                ${['low', 'medium', 'high'].map(level => {
                                    const labels = { low: 'Rendah', medium: 'Sedang', high: 'Tinggi' };
                                    const active = q === level;
                                    return `
                                    <button onclick="setGraphicsQuality('${level}')"
                                        class="py-2 rounded-xl font-extrabold text-xs sm:text-sm border-2 ${
                                            active ? 'bg-[#276749] text-[#FCF9F2] border-[#183629]' : 'bg-[#F6F1E3] text-[#183629] border-gray-300'
                                        }">
                                        ${labels[level]}
                                    </button>`;
                                }).join('')}
                            </div>
                        </div>

                        <div class="card-surface p-3.5 rounded-2xl border-2 border-[#689F77] flex items-center justify-between">
                            <span class="text-sm font-extrabold text-[#183629]">Efek Suara</span>
                            <button onclick="toggleSfxSetting()" class="px-4 py-1.5 rounded-xl font-extrabold text-xs ${
                                state.settings.sfx ? 'bg-[#276749] text-[#FCF9F2]' : 'bg-gray-300 text-gray-700'
                            }">
                                ${state.settings.sfx ? 'Aktif' : 'Mati'}
                            </button>
                        </div>

                        <div class="card-surface p-3.5 rounded-2xl border-2 border-[#689F77] flex items-center justify-between">
                            <span class="text-sm font-extrabold text-[#183629]">Musik Hutan</span>
                            <button onclick="toggleMusicSetting()" class="px-4 py-1.5 rounded-xl font-extrabold text-xs ${
                                state.settings.music ? 'bg-[#276749] text-[#FCF9F2]' : 'bg-gray-300 text-gray-700'
                            }">
                                ${state.settings.music ? 'Aktif' : 'Mati'}
                            </button>
                        </div>
                    </div>
                    <button onclick="closeModal()" class="btn-3d btn-green mt-5 w-full py-3.5 rounded-2xl font-extrabold text-base">
                        Simpan & Tutup
                    </button>
                </div>
            `);
        }

        function setGraphicsQuality(level) {
            state.settings.quality = level;
            ForestWorld3D.applyQualitySettings(level);
            openSettingsModal();
        }

        function toggleSfxSetting() {
            state.settings.sfx = !state.settings.sfx;
            openSettingsModal();
        }

        function toggleMusicSetting() {
            state.settings.music = !state.settings.music;
            AudioEngine.syncMusic();
            openSettingsModal();
        }

        function launchConfetti() {
            const colors = ['#276749', '#E6B84C', '#6BAED6', '#D97343', '#689F77'];
            for (let i = 0; i < 36; i++) {
                const bit = document.createElement('div');
                bit.className = 'confetti-bit';
                bit.style.left = (Math.random() * 100) + 'vw';
                bit.style.backgroundColor = colors[i % colors.length];
                bit.style.animationDuration = (1.8 + Math.random() * 1.6) + 's';
                bit.style.animationDelay = (Math.random() * 0.35) + 's';
                document.body.appendChild(bit);
                setTimeout(() => bit.remove(), 3600);
            }
        }

        function escapeHtml(str) {
            return String(str || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        /**
         * ============================================================================
         * 16. INISIALISASI APLIKASI SAAT HALAMAN DIMUAT
         * ============================================================================
         */
        window.addEventListener('DOMContentLoaded', () => {
            ForestWorld3D.init();
            renderScreen();

            // Aktifkan Web Audio API otomatis pada sentuhan/klik pertama agar musik latar langsung terdengar
            const unlockAudioOnce = () => {
                AudioEngine.unlock();
                window.removeEventListener('pointerdown', unlockAudioOnce);
                window.removeEventListener('keydown', unlockAudioOnce);
            };
            window.addEventListener('pointerdown', unlockAudioOnce);
            window.addEventListener('keydown', unlockAudioOnce);
        });
    </script>
</body>
</html>
